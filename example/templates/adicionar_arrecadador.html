{% extends 'base.html' %}
{% load static %}

{% block title %}Cadastrar Arrecadador{% endblock %}

{% block extra_head %}
    <script>
        async function buscarEndereco() {
            const cep = document.getElementById('cep').value.replace('-', '');
            if (cep.length === 8) {
                try {
                    const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                    const data = await response.json();
                    if (!data.erro) {
                        document.getElementById('bairro').value = data.bairro;
                        document.getElementById('cidade').value = data.localidade;
                    } else {
                        alert('CEP não encontrado.');
                        document.getElementById('bairro').value = '';
                        document.getElementById('cidade').value = '';
                    }
                } catch (error) {
                    console.error('Erro ao buscar o CEP:', error);
                }
            } else {
                alert('Por favor, digite um CEP válido.');
            }
        }
    </script>
{% endblock %}

{% block content %}
    <h1 class="text-center mb-4">Cadastrar Arrecadador</h1>
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card p-4 shadow-sm rounded-4">
                <form method="POST" action="{% url 'cadastrar_arrecadador' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome:</label>
                        <input type="text" id="nome" name="nome" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="cep" class="form-label">CEP:</label>
                        <input type="text" id="cep" name="cep" class="form-control" maxlength="9" placeholder="00000-000" required onblur="buscarEndereco()">
                    </div>
                    <div class="mb-3">
                        <label for="bairro" class="form-label">Bairro:</label>
                        <input type="text" id="bairro" name="bairro" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="cidade" class="form-label">Cidade:</label>
                        <input type="text" id="cidade" name="cidade" class="form-control" required>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg mt-3">Cadastrar Arrecadador</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
